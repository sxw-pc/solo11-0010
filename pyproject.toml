[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citefuse"
version = "0.1.0"
description = "Fully offline bibliographic record deduplication and golden-record engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi~=0.115.0",
  "uvicorn~=0.32.0",
  "PyYAML~=6.0",
  "pydantic~=2.9.0",
]

[project.optional-dependencies]
test = ["pytest~=8.3.0", "httpx~=0.27.0"]

[project.scripts]
citefuse = "citefuse.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citefuse = ["resources/*.yaml"]
