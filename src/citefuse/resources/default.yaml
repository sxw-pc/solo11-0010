# citefuse default configuration
# All values are deterministic. Edit + rerun; the SHA-256 of this document is
# recorded on every pipeline run so a result can always be reproduced.
version: 1

normalization:
  # NFKC folds full-width Latin letters and punctuation to ASCII.
  unicode_form: NFKC
  casefold: true
  strip_punctuation: true
  # Author strings may be "Family, Given" or "Given Family"; comma form wins.
  author_formats: [family_given, given_family]
  # Removed before building title signatures (blocking only, not scoring).
  title_stopwords:
    ["a", "an", "and", "are", "as", "at", "by", "for", "from", "in", "of",
     "on", "or", "the", "to", "under", "via", "with", "study", "studies",
     "analysis", "evidence", "synthesis"]
  # Fictional venue aliases. The key is the canonical normalized venue name.
  venue_aliases:
    Journal of Fictional Evidence Synthesis:
      [J. Fict. Evid. Synth., JFES, Journal of Fictional Evidence Synthesis (JFES)]
    Imaginary Research Methods Quarterly:
      [Imag. Res. Methods Q., IRMQ, Imaginary Research Methods Q.]
    Proceedings of the Synthetic Evidence Conference:
      [Proc. Synth. Evid. Conf., PSEC, Synthetic Evidence Conference Proceedings]
    Annals of Invented Public Health:
      [Ann. Invented Public Health, AI Pure Health, Annals of Invented Public Hlth.]
    Fabricated Clinical Trials Review:
      [Fabr. Clin. Trials Rev., FCTR, Fabricated Clinical Trial Review]

blocking:
  # Each strategy can be disabled independently. The final candidate set is the
  # union; all strategies are O(n^2) inside a bucket and suitable for local use.
  year_venue:
    enabled: true
    venue_prefix_len: 5
  title_signature:
    enabled: true
    token_count: 5
    min_token_length: 2
  author_year:
    enabled: true

scoring:
  # Weights need not sum to one; the final score is normalized by effective
  # weight. DOI is intentionally strong but cannot alone exceed the match
  # threshold.
  weights:
    title: 0.38
    authors: 0.18
    venue: 0.10
    year: 0.10
    pages: 0.06
    doi: 0.18
  # "neutral" gives a missing field a fixed score and keeps its weight.
  # "exclude" drops the field and renormalizes over present fields.
  missing_policy: neutral
  neutral_score: 0.50
  # Score by absolute year difference: exact, 1 year, 2 years, then zero.
  year_diff_scores: [1.0, 0.75, 0.40]
  review_low: 0.68
  match_threshold: 0.80

survivorship:
  # Supported rules: longest, most_frequent, min_year, source_priority,
  # non_null_concat. Ties are resolved by source priority, then record key.
  title: longest
  authors: non_null_concat
  venue: most_frequent
  year: min_year
  volume: non_null_concat
  issue: non_null_concat
  pages: longest
  doi: source_priority
  # Earlier entries win. Must cover every source in an imported batch for a
  # fully explained golden record; unknown sources sort last.
  source_priority: [ORBIT, LANTERN, MEADOW, COMPASS]

review:
  # Unresolved pairs in [review_low, match_threshold) are available to reviewers.
  default_page_size: 10
  max_page_size: 100

drift:
  # Field-level semantic drift guard, executed before blocking. Every rule and
  # threshold below is part of the config fingerprint, so edits are auditable.
  enabled: true
  # On any internal guard error, skip detection and keep the pipeline running.
  fail_open: true
  include_summary: true
  # Per-record audit events are verbose; the per-run summary is always emitted.
  audit_per_record: false

  severity:
    # Continuous drift score -> tier cut-offs (minor <= medium <= heavy).
    minor: 0.25
    medium: 0.55
    heavy: 0.80

  baseline:
    # Minimum historical observations before distribution checks activate.
    min_samples: 20
    # Fold accepted (clean/minor) records back into a new baseline version.
    update_on_run: true
    absorb_max_tier: minor
    max_categories: 500
    max_profile_features: 1000

  year:
    enabled: true
    weight: 1.0
    min_year: 1500
    max_year: 2100
    two_digit_pivot: 70
    outlier_sigmas: 3.0
    score_era_modern: 0.30
    score_era_imperial: 0.60
    score_era_unparsed: 0.70
    score_unrecognized: 0.90
    score_outlier: 0.60
    score_two_digit: 0.30

  source:
    enabled: true
    weight: 1.0
    # Canonical codes accepted without a baseline.
    known_codes: [ORBIT, LANTERN, MEADOW, COMPASS]
    # Fictional organization full names / aliases -> canonical code.
    aliases:
      Orbital Bibliographic Exchange: ORBIT
      The Orbital Bibliographic Exchange Network: ORBIT
      Lantern Literature Aggregator: LANTERN
      Lantern Literature Aggregation Service: LANTERN
      Meadow Metadata Consortium: MEADOW
      The Meadow Metadata Consortium: MEADOW
      Compass Citation Cooperative: COMPASS
      Compass Citation Cooperative Society: COMPASS
    score_alias: 0.30
    score_unknown_category: 0.65
    score_unrecognized: 0.90
    code_min_len: 2
    code_max_len: 20

  authors:
    enabled: true
    weight: 1.0
    # Case-insensitive collective/corporate authorship markers.
    collective_markers:
      [consortium, cooperative, working group, task force, society,
       association, institute, laboratory, council, network, committee,
       collaboration, center, centre, department, ministry, organization,
       协作组, 课题组, 委员会, 学会, 协会, 研究院, 研究所, 实验室, 中心, 工作组]
    score_collective_only: 0.65
    score_collective_mixed: 0.35
    score_unrecognized: 0.90
    junk_char_ratio: 0.45

  generic:
    # DOI shape guard. DOI is a high-cardinality identifier, so only its
    # structural pattern is validated; a well-formed DOI is never penalized for
    # being previously unseen. A malformed DOI is heavy drift.
    doi:
      enabled: true
      weight: 0.8
      kind: shape
      pattern: '10\.[0-9]{4,9}/\S+'
      score_pattern_violation: 0.85
      score_unknown_category: 0.60
      score_numeric_outlier: 0.60
      min_profile_similarity: 0.25
      score_profile_drift: 0.55
      outlier_sigmas: 3.0
